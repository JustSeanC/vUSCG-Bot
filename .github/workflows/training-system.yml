name: Training system

on:
  push:
    branches:
      - develop/training-system
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        version: ['5.7.44', '8.4']
    name: Training tests (MySQL ${{ matrix.version }})
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: bash scripts/test-training-release.sh "$MYSQL_TEST_VERSION"
        env:
          MYSQL_TEST_VERSION: ${{ matrix.version }}
